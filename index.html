<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>MindForge</title>

<style>
body { font-family: Arial; background:#0f0f0f; color:white; padding:20px; }
.card { background:#1c1c1c; padding:20px; border-radius:15px; }
button { margin-top:10px; padding:12px; border:none; border-radius:10px; width:100%; font-size:16px;}
.btn { background:#333; color:white; }
.deep { background:#6a00ff; color:white; }
.fav { background:#ff9800; color:white; }
.next { background:#2196f3; color:white; }
.progress { margin:10px 0; opacity:0.7; }
</style>
</head>

<body>

<h2>🧠 MindForge</h2>

<p class="progress" id="progress">Прогресс: 0</p>

<select id="category">
<option>Россия</option>
<option>Личности</option>
</select>

<div class="card">
<h3 id="title"></h3>
<p id="short"></p>

<button class="btn" onclick="showFull()">🧠 ГЛУБЖЕ</button>
<button class="fav" onclick="addFav()">⭐ В избранное</button>
<button class="next" onclick="nextCard()">➡️ ЕЩЁ</button>
</div>

<div id="fullBlock" style="display:none;">
<p id="full"></p>
<button class="deep" onclick="showDeep()">🔥 ЕЩЁ ГЛУБЖЕ</button>
</div>

<div id="deepBlock" style="display:none;">
<p id="deep"></p>
</div>

<script>

const cards = [

{
title:"Пётр I",
category:"Россия",
short:"Создал современную Россию через жёсткие реформы",

full:`📍 Контекст:
Россия сильно отставала от Европы.

⚙️ Что сделал:
- создал флот
- реформировал армию
- усилил власть

💥 Цена:
- тяжёлые налоги
- принудительный труд

👉 Итог: Россия стала империей`,

deep:`🧠 Экспертный уровень:

📊 Парадокс:
усилил государство → снизил свободу общества

⚖️ Альтернатива:
медленные реформы = меньше боли, но риск отставания

👉 Вывод:
ускоренное развитие почти всегда дорого стоит`
},

{
title:"Иван III",
category:"Россия",
short:"Создал основу российского государства",

full:`📍 Контекст:
Россия была раздроблена и зависела от Орды

⚙️ Что сделал:
- объединил земли
- прекратил зависимость от Орды
- усилил власть Москвы

👉 Итог: начало централизованного государства`,

deep:`🧠 Экспертный уровень:

📊 Стратегия:
сначала усиление центра → потом расширение

⚖️ Альтернатива:
раздробленность могла сохраниться

👉 Вывод:
сильные государства создаются через централизацию`
},

{
title:"Наполеон",
category:"Личности",
short:"Гений, проигравший из-за масштаба",

full:`📍 Контекст:
доминировал в Европе

⚙️ Ошибка:
применил ту же стратегию в России

📦 Проблема:
- расстояния
- логистика

👉 Итог: армия разрушилась`,

deep:`🧠 Экспертный уровень:

📊 Главная ошибка:
игнорирование контекста

⚖️ Альтернатива:
не идти вглубь России

👉 Вывод:
стратегия должна меняться под условия`
},

{
title:"Сталин",
category:"Россия",
short:"Быстро превратил СССР в индустриальную державу",

full:`📍 Контекст:
страна отставала

⚙️ Что сделал:
- индустриализация
- централизованная экономика

💥 Цена:
- репрессии
- жёсткий контроль

👉 Итог: мощная индустрия`,

deep:`🧠 Экспертный уровень:

📊 Парадокс:
рост через давление

⚖️ Альтернатива:
медленное развитие

👉 Вывод:
скорость развития часто требует контроля`
}

];

let currentIndex = 0;
let progress = 0;

function loadCard(){
let cat=document.getElementById("category").value;
let filtered=cards.filter(c=>c.category===cat);

if(filtered.length===0) return;

let card=filtered[currentIndex % filtered.length];

document.getElementById("title").innerText=card.title;
document.getElementById("short").innerText=card.short;
document.getElementById("full").innerText=card.full;
document.getElementById("deep").innerText=card.deep;

document.getElementById("fullBlock").style.display="none";
document.getElementById("deepBlock").style.display="none";
}

function nextCard(){
currentIndex++;
progress++;
document.getElementById("progress").innerText="Прогресс: "+progress;
loadCard();
}

function showFull(){
document.getElementById("fullBlock").style.display="block";
}

function showDeep(){
document.getElementById("deepBlock").style.display="block";
}

function addFav(){
let favs=JSON.parse(localStorage.getItem("favs"))||[];
let title=document.getElementById("title").innerText;

if(!favs.includes(title)){
favs.push(title);
localStorage.setItem("favs",JSON.stringify(favs));
}

alert("Сохранено ⭐");
}

document.getElementById("category").addEventListener("change",loadCard);

loadCard();

</script>

</body>
</html>

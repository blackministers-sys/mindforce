<!DOCTYPE html>

<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>MindForge</title>

<style>
body{
background:#0f0f0f;
color:white;
font-family:Arial,sans-serif;
padding:20px;
max-width:900px;
margin:auto;
}

h1{
margin-bottom:10px;
}

.card{
background:#1c1c1c;
padding:20px;
border-radius:15px;
margin-top:20px;
}

button{
width:100%;
padding:12px;
margin-top:10px;
border:none;
border-radius:10px;
font-size:16px;
cursor:pointer;
}

.btn{
background:#333;
color:white;
}

.fav{
background:#ff9800;
color:white;
}

.next{
background:#2196f3;
color:white;
}

.deep{
background:#7b00ff;
color:white;
}

.progress{
opacity:0.8;
margin-bottom:15px;
}

.hidden{
display:none;
}

select{
padding:10px;
border-radius:10px;
margin-bottom:15px;
width:100%;
}

#message{
margin-top:10px;
color:#7CFC00;
font-weight:bold;
}
</style>

</head>

<body>

<h1>🧠 MindForge</h1>

<div class="progress" id="progress">
Прогресс: 0
</div>

<select id="category"></select>

<div class="card">

<h2 id="title"></h2>

<p id="short"></p>

<button class="btn" onclick="showFull()">
🧠 ГЛУБЖЕ
</button>

<button class="fav" onclick="addFav()">
⭐ В ИЗБРАННОЕ
</button>

<button class="next" onclick="nextCard()">
➡️ СЛЕДУЮЩАЯ КАРТОЧКА
</button>

<div id="message"></div>

</div>

<div id="fullBlock" class="hidden card">

<h3>📖 Подробно</h3>

<p id="full"></p>

<button class="deep" onclick="showDeep()">
🔥 ЕЩЁ ГЛУБЖЕ
</button>

</div>

<div id="deepBlock" class="hidden card">

<h3>🧠 Экспертный уровень</h3>

<p id="deep"></p>

</div>

<script>

let cards = [];
let currentIndex = 0;
let progress = 0;

async function loadCards(){

const response = await fetch("cards.json");
cards = await response.json();

populateCategories();
loadCard();

}

function populateCategories(){

const categories =
[...new Set(cards.map(c => c.category))];

const select =
document.getElementById("category");

select.innerHTML = "";

categories.forEach(cat => {

const option =
document.createElement("option");

option.value = cat;
option.textContent = cat;

select.appendChild(option);

});

select.addEventListener("change", () => {

currentIndex = 0;
loadCard();

});

}

function getFilteredCards(){

const category =
document.getElementById("category").value;

return cards.filter(
c => c.category === category
);

}

function loadCard(){

const filtered = getFilteredCards();

if(filtered.length === 0) return;

const card =
filtered[currentIndex % filtered.length];

document.getElementById("title").textContent =
card.title;

document.getElementById("short").textContent =
card.short;

document.getElementById("full").textContent =
card.full;

document.getElementById("deep").textContent =
card.deep;

document.getElementById("fullBlock")
.classList.add("hidden");

document.getElementById("deepBlock")
.classList.add("hidden");

}

function nextCard(){

const filtered = getFilteredCards();

currentIndex++;

if(currentIndex >= filtered.length){

currentIndex = 0;

document.getElementById("message")
.textContent =
"🎉 Ты просмотрел все карточки этой категории";

}else{

document.getElementById("message")
.textContent = "";

}

progress++;

document.getElementById("progress")
.textContent =
"Прогресс: " + progress;

loadCard();

}

function showFull(){

document.getElementById("fullBlock")
.classList.remove("hidden");

}

function showDeep(){

document.getElementById("deepBlock")
.classList.remove("hidden");

}

function addFav(){

let favs =
JSON.parse(
localStorage.getItem("favs")
) || [];

const title =
document.getElementById("title")
.textContent;

if(!favs.includes(title)){

favs.push(title);

localStorage.setItem(
"favs",
JSON.stringify(favs)
);

document.getElementById("message")
.textContent =
"⭐ Карточка добавлена в избранное";

}else{

document.getElementById("message")
.textContent =
"⭐ Уже находится в избранном";

}

}

loadCards();

</script>

</body>
</html>

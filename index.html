<!DOCTYPE html>

<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>MindForge</title>

<style>
body{
background:#0f0f0f;
color:white;
font-family:Arial,sans-serif;
padding:20px;
max-width:900px;
margin:auto;
}
.card{
background:#1c1c1c;
padding:20px;
border-radius:15px;
margin-top:20px;
}
button{
width:100%;
padding:12px;
margin-top:10px;
border:none;
border-radius:10px;
font-size:16px;
}
select{
width:100%;
padding:10px;
border-radius:10px;
}
.hidden{
display:none;
}
</style>

</head>
<body>

<h1>🧠 MindForge</h1>

<p id="counter">Загрузка...</p>

<select id="category"></select>

<div class="card">
<h2 id="title"></h2>
<p id="short"></p>

<button onclick="showFull()">🧠 ГЛУБЖЕ</button> <button onclick="nextCard()">➡️ СЛЕДУЮЩАЯ КАРТОЧКА</button>

</div>

<div class="card hidden" id="fullBlock">
<h3>Подробно</h3>
<p id="full"></p>
<button onclick="showDeep()">🔥 ЕЩЁ ГЛУБЖЕ</button>
</div>

<div class="card hidden" id="deepBlock">
<h3>Экспертный уровень</h3>
<p id="deep"></p>
</div>

<script>

let cards = [];
let currentIndex = 0;

async function init(){

const response = await fetch("cards.json?v=" + Date.now());
cards = await response.json();

document.getElementById("counter").innerText =
"Карточек загружено: " + cards.length;

const categories =
["Все", ...new Set(cards.map(c => c.category))];

const select =
document.getElementById("category");

categories.forEach(cat => {

const option =
document.createElement("option");

option.value = cat;
option.textContent = cat;

select.appendChild(option);

});

select.addEventListener("change", () => {
currentIndex = 0;
loadCard();
});

loadCard();

}

function filteredCards(){

const cat =
document.getElementById("category").value;

if(cat === "Все") return cards;

return cards.filter(c => c.category === cat);

}

function loadCard(){

const list = filteredCards();

if(list.length === 0) return;

const card =
list[currentIndex % list.length];

title.textContent = card.title;
short.textContent = card.short;
full.textContent = card.full;
deep.textContent = card.deep;

fullBlock.classList.add("hidden");
deepBlock.classList.add("hidden");

}

function nextCard(){

const list = filteredCards();

currentIndex++;

if(currentIndex >= list.length){
currentIndex = 0;
}

loadCard();

}

function showFull(){
fullBlock.classList.remove("hidden");
}

function showDeep(){
deepBlock.classList.remove("hidden");
}

init();

</script>

</body>
</html>

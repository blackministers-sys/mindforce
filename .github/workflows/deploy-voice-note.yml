name: Deploy Golos test app

on:
  push:
    branches:
      - plaud-voice-mvp
    paths:
      - "voice-note/**"
      - ".github/workflows/deploy-voice-note.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: golos-pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5
      - name: Upload app
        uses: actions/upload-pages-artifact@v3
        with:
          path: voice-note
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4

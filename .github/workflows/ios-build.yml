name: iOS build

on:
  push:
    branches: [voice-ios-native]
    paths:
      - "ios/**"
      - ".github/workflows/ios-build.yml"
      - ".github/workflows/ios-testflight.yml"
  pull_request:
    branches: [main]
    paths:
      - "ios/**"
      - ".github/workflows/ios-build.yml"
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Build iOS Simulator app
        run: |
          for CONFIGURATION in Debug Release; do
            echo "Building simulator configuration: $CONFIGURATION"
            xcodebuild \
              -project ios/Golos.xcodeproj \
              -scheme Golos \
              -sdk iphonesimulator \
              -configuration "$CONFIGURATION" \
              -destination 'generic/platform=iOS Simulator' \
              ARCHS=arm64 \
              ONLY_ACTIVE_ARCH=YES \
              CODE_SIGNING_ALLOWED=NO \
              build
          done

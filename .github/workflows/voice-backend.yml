name: Voice backend tests

on:
  push:
    branches: [voice-ios-native]
    paths:
      - "voice-backend/**"
      - ".github/workflows/voice-backend.yml"
  pull_request:
    branches: [main]
    paths:
      - "voice-backend/**"
      - ".github/workflows/voice-backend.yml"
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: voice-backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install dependencies
        run: npm install --ignore-scripts
      - name: Run backend tests
        run: npm test
      - name: Check JavaScript syntax
        run: |
          node --check src/server.js
          node --check src/phone.js

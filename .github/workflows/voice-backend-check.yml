name: Voice backend check

on:
  push:
    branches: [voice-ios-native]
    paths:
      - "voice-backend/**"
      - ".github/workflows/voice-backend-check.yml"
  pull_request:
    branches: [main]
    paths:
      - "voice-backend/**"
      - ".github/workflows/voice-backend-check.yml"

jobs:
  check:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: voice-backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install
      - run: npm run check
